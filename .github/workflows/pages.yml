name: Deploy GitHub Pages

# デフォルトブランチの内容を gh-pages ブランチへ同期し、
# GitHub Pages（gh-pages ブランチ配信）を自動更新する
on:
  push:
    branches: ["claude/claude-code-setup-tsyhs"]  # デフォルトブランチ
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to gh-pages
        run: git push origin HEAD:gh-pages --force
