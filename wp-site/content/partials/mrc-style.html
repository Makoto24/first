<style>
.mrc{--ink:#1a1a1a;--paper:#FAF8F5;--terra:#B85C3A;--terra-d:#9A4A2D;--stone:#6B6560;--smoke:#E8E4DF;--white:#fff;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo",sans-serif;color:var(--ink);line-height:1.8;-webkit-font-smoothing:antialiased}
.mrc *{box-sizing:border-box}
.mrc img{max-width:100%;height:auto;display:block}
.mrc a{color:var(--terra)!important;text-decoration:none!important}
.mrc a:hover{text-decoration:underline!important;text-underline-offset:3px!important}
.mrc-wrap{max-width:860px;margin:0 auto;padding:0 32px}
.mrc-label{font-size:.65rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--terra);margin:0 0 12px}
.mrc-title{font-family:"Shippori Mincho","Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(1.5rem,3.4vw,2.4rem);font-weight:400;line-height:1.3;color:var(--ink);margin:0;background:none!important;padding:0!important;border:none!important}
.mrc-lead{font-size:.92rem;color:var(--stone);line-height:2;margin:18px 0 0;max-width:640px}

/* section bands */
.mrc-section{padding:64px 0}
.mrc-pagehead{padding:72px 0 56px;text-align:center}
.mrc-pagehead .mrc-lead{margin-left:auto;margin-right:auto}
.is-paper{background:var(--paper)}
.is-white{background:var(--white)}
.is-ink{background:var(--ink)}
.is-ink .mrc-title{color:var(--white)}
.is-ink .mrc-lead,.is-ink p{color:rgba(255,255,255,.7)}

/* prose */
.mrc-prose h2{font-family:"Shippori Mincho","Yu Mincho",serif;font-size:clamp(1.25rem,2.6vw,1.7rem);font-weight:500;color:var(--ink);margin:0 0 18px;padding:0 0 14px;border-bottom:1px solid var(--smoke);background:none!important}
.mrc-prose h2:not(:first-child){margin-top:52px}
.mrc-prose h3{font-size:1.02rem;font-weight:700;color:var(--ink);margin:32px 0 10px;background:none!important;padding:0!important}
.mrc-prose h4{font-size:.9rem;font-weight:700;color:var(--terra);margin:24px 0 8px;background:none!important;padding:0!important}
.mrc-prose p{font-size:.92rem;color:#3a3a3a;margin:0 0 16px}
.mrc-prose ul,.mrc-prose ol{margin:0 0 18px;padding-left:1.3em}
.mrc-prose li{font-size:.92rem;color:#3a3a3a;margin:0 0 8px}
.mrc-prose strong{font-weight:700;color:var(--ink)}
.mrc-prose small{font-size:.8rem;color:var(--stone)}

/* tables */
.mrc-prose figure.wp-block-table{overflow-x:auto;margin:0 0 22px}
.mrc-prose table{width:100%;border-collapse:collapse;margin:0 0 22px;font-size:.86rem;background:var(--white)}
.mrc-prose th,.mrc-prose td{border:1px solid var(--smoke);padding:12px 14px;text-align:left;vertical-align:top}
.mrc-prose thead th{background:var(--ink);color:var(--white);font-weight:700;font-size:.8rem;letter-spacing:.02em}
.mrc-prose tbody th{background:var(--paper);font-weight:700;white-space:nowrap}

/* callout */
.mrc-callout{background:var(--paper);border-left:3px solid var(--terra);padding:22px 24px;margin:0 0 24px}
.mrc-callout h3{margin-top:0!important}
.mrc-callout p:last-child{margin-bottom:0}

/* buttons */
.mrc .mrc-btn{display:inline-block!important;background:var(--terra)!important;color:#fff!important;font-size:.8rem!important;font-weight:700!important;letter-spacing:.06em!important;padding:14px 34px!important;border:1px solid var(--terra)!important;text-decoration:none!important;transition:background .3s!important;line-height:1!important;cursor:pointer}
.mrc .mrc-btn:hover{background:var(--terra-d)!important;border-color:var(--terra-d)!important;color:#fff!important;text-decoration:none!important}
.mrc .mrc-btn-ghost{background:transparent!important;color:var(--terra)!important}
.mrc .mrc-btn-ghost:hover{background:var(--paper)!important;color:var(--terra-d)!important}
.mrc-btnrow{display:flex;flex-wrap:wrap;gap:14px;margin:28px 0 0}

/* embedded map / form */
.mrc iframe{width:100%;border:0;max-width:100%;margin:8px 0 0}

@media(max-width:600px){
  .mrc-wrap{padding:0 20px}
  .mrc-section{padding:48px 0}
  .mrc-pagehead{padding:52px 0 40px}
  .mrc-prose table{font-size:.8rem}
  .mrc-prose th,.mrc-prose td{padding:10px}
}
</style>
